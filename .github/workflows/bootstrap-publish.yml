# One-shot bootstrap. npm can only attach a trusted publisher to a package that
# already exists, so the very first version has to be published with a token.
#
# Delete this file, and the NPM_TOKEN secret, as soon as it has run once.
# Every release after that goes through publish.yml, which uses OIDC.
name: Bootstrap publish (one-shot)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "publish" to confirm the first release to npm
        required: true
        type: string

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check the confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "publish" ]; then
            echo 'Confirmation missing: re-run with confirm set to "publish".' >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      - run: bun run lint

      - run: bun test

      - run: bun run build

      - name: Publish (dry run)
        run: npm publish --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
