# Releases are cut by dispatching this workflow from the Actions tab. It reads
# the version from package.json, publishes to npm, then creates the matching
# tag and GitHub release — so a release never needs a tag pushed by hand.
#
# The filename matters: npm's trusted publisher matches on it. Renaming this
# file breaks publishing until the configuration on npmjs.com is updated.
name: Publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate and pack, but do not publish or tag
        type: boolean
        default: false

permissions:
  contents: write # create the release tag and the GitHub release
  id-token: write # npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest # trusted publishing requires a cloud-hosted runner
    steps:
      - name: Refuse to release from anywhere but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases are cut from main; this run is on ${GITHUB_REF}." >&2
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release notes are generated from history since the last tag

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Trusted publishing needs Node >= 22.14.0 and npm >= 11.5.1. Node 24.x
      # covers both — it bundles npm 11.17 — so npm needs no separate upgrade.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Read the version to release
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      # Both checks below catch the same mistake — dispatching without bumping
      # package.json — before anything is published, rather than after npm has
      # rejected the duplicate with a 409.
      - name: Check the tag does not already exist
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists. Bump the version in package.json first." >&2
            exit 1
          fi

      - name: Check the version is not already on npm
        run: |
          name="$(node -p "require('./package.json').name")"
          version="${{ steps.version.outputs.version }}"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published. Bump the version in package.json first." >&2
            exit 1
          fi

      - run: bun install --frozen-lockfile

      - run: bun run lint

      - run: bun test

      - run: bun run build

      - name: Publish (dry run)
        if: inputs.dry_run
        run: npm publish --dry-run

      # No NODE_AUTH_TOKEN: npm exchanges the workflow's OIDC token for
      # short-lived credentials, against the trusted publisher configured on
      # npmjs.com for this repository and this workflow filename.
      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        run: npm publish

      # After the publish, so a failed publish never leaves a GitHub release
      # pointing at a version that is not on npm. gh creates the tag itself.
      - name: Tag and create the GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes
