# Releases are cut by dispatching this workflow from the Actions tab. It bumps
# the version, publishes to npm, then creates the matching tag and GitHub
# release — nothing has to be bumped or tagged by hand.
#
# The filename matters: npm's trusted publisher matches on it. Renaming this
# file breaks publishing until the configuration on npmjs.com is updated.
name: Publish

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to apply before publishing
        type: choice
        options: [patch, minor, major, none]
        default: patch
      dry_run:
        description: Validate and pack, but do not push, publish or tag
        type: boolean
        default: false

permissions:
  contents: write # push the version bump, create the tag and the release
  id-token: write # npm trusted publishing (OIDC)

# Two releases at once would race on the version bump.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest # trusted publishing requires a cloud-hosted runner
    steps:
      - name: Refuse to release from anywhere but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases are cut from main; this run is on ${GITHUB_REF}." >&2
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release notes are generated from history since the last tag

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Trusted publishing needs Node >= 22.14.0 and npm >= 11.5.1. Node 24.x
      # covers both — it bundles npm 11.17 — so npm needs no separate upgrade.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # "none" republishes the version already in package.json. It is the retry
      # path for a run that pushed its bump and then failed to publish.
      - name: Apply the version bump
        id: version
        run: |
          if [ "${{ inputs.bump }}" != "none" ]; then
            npm version "${{ inputs.bump }}" --no-git-tag-version >/dev/null
          fi
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version (bump: ${{ inputs.bump }})"

      # Both checks below fail the run before anything is pushed or published,
      # rather than leaving a 409 from the registry to explain the mistake.
      - name: Check the tag does not already exist
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists." >&2
            exit 1
          fi

      - name: Check the version is not already on npm
        run: |
          name="$(node -p "require('./package.json').name")"
          version="${{ steps.version.outputs.version }}"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published." >&2
            exit 1
          fi

      - run: bun install --frozen-lockfile

      - run: bun run lint

      - run: bun test

      - run: bun run build

      - name: Publish (dry run)
        if: inputs.dry_run
        run: npm publish --dry-run

      # Pushed before publishing, deliberately. If the push fails — a protected
      # branch, or another commit landing first — nothing has been published and
      # main is untouched. The reverse order can put a version on npm that the
      # repository has no record of, which cannot be undone.
      - name: Push the version bump
        if: ${{ !inputs.dry_run && inputs.bump != 'none' }}
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Release ${{ steps.version.outputs.version }}" package.json
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # No NODE_AUTH_TOKEN: npm exchanges the workflow's OIDC token for
      # short-lived credentials, against the trusted publisher configured on
      # npmjs.com for this repository and this workflow filename.
      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        run: npm publish

      # After the publish, so a failed publish never leaves a GitHub release
      # pointing at a version that is not on npm. gh creates the tag itself.
      - name: Tag and create the GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --target "${{ steps.commit.outputs.sha || github.sha }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes
